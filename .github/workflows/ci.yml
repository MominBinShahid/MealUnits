name: CI

on:
  push:
    branches: [main]
  # `edited` is here because `golden-change` reads the PULL REQUEST BODY. Without
  # it the job cannot be re-triggered by fixing the body: the default types are
  # opened/synchronize/reopened, and `gh run rerun` replays the old event payload
  # with the old body, so adding the missing GOLDEN-CHANGE: marker changes
  # nothing and the only way through is to close and reopen the PR. That is what
  # PR #7 had to do. Naming any type means naming the three defaults as well —
  # the list replaces them rather than adding to them.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# §13.8: typecheck, unit suite, Stryker on the core and the integration suite,
# and the plan checker are all required to merge. They run as separate jobs so a
# failure names itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test

  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # §20.3 — 24 registered checks and a 103-mutation self-test which, until
      # 2026-09-12, ran only when somebody remembered to type them. CLAUDE.md
      # rule 6 asked for it by convention and nothing enforced it, so every
      # plan-against-code guarantee in this repository was one forgetful commit
      # from going quiet — which T1 already names as the worst way for a
      # guarantee to end. Found when a rule added under §20.3's own obligation
      # turned out to be unable to run on anybody's pull request.
      #
      # No npm step: the checker reads the documents and the TypeScript as text.
      #
      # The self-test runs FIRST and on its own line. A checker whose own seeded
      # mutations escape has a worthless "clean.", so proving the instrument
      # before reading it is the whole point of running both.
      - name: The checker's own seeded mutations
        run: python3 check-plan.py --self-test
      - name: PLAN, BACKLOG and BUILD-NOTES against the code
        run: python3 check-plan.py

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # §13.4: thresholds.break is 100. A surviving mutant fails the build.
      - name: Mutation testing on the core
        run: npm run mutate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation

  golden-change:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # §13.8: changing a golden file requires GOLDEN-CHANGE: plus a rationale
      # in the pull request body. §13.7's reason — mutation testing cannot
      # validate the oracle, so changing one has to be a conspicuous act.
      - name: A golden-file change needs GOLDEN-CHANGE in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -q '^test/golden/'; then
            echo "This pull request changes a golden file."
            if printf '%s' "$PR_BODY" | grep -q 'GOLDEN-CHANGE:'; then
              echo "GOLDEN-CHANGE: found."
            else
              echo "::error::A golden file changed. §13.8 requires 'GOLDEN-CHANGE:' and a rationale in the pull request body."
              exit 1
            fi
          else
            echo "No golden files changed."
          fi
