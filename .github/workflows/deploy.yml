name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# §11.5: Pages needs BOTH pages: write and id-token: write, plus the
# github-pages environment on the deploy job. Omitting either fails at the
# deploy step with an error that does not name the missing permission.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The deploy runs the full check first. A build that fails its tests must
      # never reach the phone this app is for.
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
