<!--
  The 1200x630 link-preview card, kept as source so it can be REGENERATED
  rather than existing only as a screenshot nobody can edit.

  How: serve this directory and open it in Chrome, then capture the body's
  1200x630 box and normalise it —

      python3 -m http.server 8898        # from tools/
      # screenshot the 1200x630 body, then:
      sips -s format png -z 630 1200 shot.png --out ../public/social/card.png

  The palette and the two faces are the app's own (`src/ui/styles.css` dark
  tokens, `public/fonts`), so the card cannot drift from the interface it
  advertises. The copy is the same 110-character description index.html uses.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
@font-face{font-family:'Space Grotesk';font-weight:300 700;font-display:block;src:url('../public/fonts/SpaceGrotesk.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:block;src:url('../public/fonts/IBMPlexMono-400.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:block;src:url('../public/fonts/IBMPlexMono-500.woff2') format('woff2');}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1200px;height:630px;overflow:hidden;}
body{
  background:#0c1011;
  font-family:'Space Grotesk',system-ui,sans-serif;
  color:#e8edec;
  display:flex;flex-direction:column;justify-content:center;
  padding:0 92px;
  position:relative;
}
.rule{position:absolute;left:0;top:0;height:8px;width:100%;background:#5ee6c5;}
.name{font-size:92px;font-weight:600;letter-spacing:-0.03em;line-height:1;}
.lede{font-size:38px;font-weight:400;color:#a8b3b1;line-height:1.35;margin-top:26px;max-width:900px;}
.lede b{color:#e8edec;font-weight:600;}
.formula{
  font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:400;
  color:#7b8584;margin-top:44px;letter-spacing:0.01em;
}
.formula span{color:#5ee6c5;}
.foot{
  position:absolute;left:92px;bottom:56px;right:92px;
  display:flex;align-items:center;justify-content:space-between;
}
.badge{
  font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;
  color:#0c1011;background:#5ee6c5;padding:11px 20px;border-radius:9px;
  letter-spacing:0.02em;
}
.url{font-family:'IBM Plex Mono',monospace;font-size:20px;color:#7b8584;}
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="name">MealUnits</div>
  <div class="lede">A mealtime insulin calculator for <b>type&nbsp;1 diabetes</b>.<br />Your own numbers, not anyone else&rsquo;s.</div>
  <div class="formula">correction <span>+</span> meal <span>=</span> units &nbsp;·&nbsp; offline &nbsp;·&nbsp; nothing leaves your phone</div>
  <div class="foot">
    <div class="badge">NOT A MEDICAL DEVICE</div>
    <div class="url">mominbinshahid.github.io/MealUnits</div>
  </div>
</body>
</html>
